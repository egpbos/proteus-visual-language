[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "proteus-plotly"
version = "0.1.0"
description = "PROTEUS Thermocline Plotly theme: light and dark templates, brand color cycles, module domain colors."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "PROTEUS collaboration", email = "dev@proteus-framework.org" }]
dependencies = ["plotly>=5.23"]
keywords = ["plotly", "template", "theme", "PROTEUS", "planetary-science"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://formingworlds.github.io/proteus-visual-language"
Repository = "https://github.com/FormingWorlds/proteus-visual-language"

[tool.setuptools.packages.find]
where = ["src"]
